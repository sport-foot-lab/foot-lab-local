# =====================================================================
# _unit_tests_dwh_bronze.yml — tests unitaires des modèles dwh_bronze
# Un test unitaire vérifie la LOGIQUE du SQL, pas les vraies données :
#   given  = lignes d'entrée inventées (remplacent la table bronze)
#   expect = lignes de sortie attendues
# dbt exécute le modèle sur "given" et compare avec "expect".
# Colonnes absentes de given -> NULL ; seules les colonnes de expect sont comparées.
# =====================================================================
version: 2

unit_tests:
  - name: topscorers_nettoyage_typage_version
    description: "Version en cours du snapshot uniquement + données salies -> sortie propre (cm/kg, espaces, essayer_cast)."
    model: api_football_topscorers          # le modèle testé

    # ---------------- ENTRÉE : 5 lignes du SNAPSHOT (plus le bronze) ----------------
    given:
      - input: ref('api_football_topscorers_snapshot')   # la table remplacée
        rows:
          # Joueur 1, ancienne version FERMÉE par le snapshot (dbt_valid_to rempli) -> doit disparaître
          - {player__id: 1, statistics__team__id: 10, statistics__league__id: 61, statistics__league__season: 2023, player__name: "  W.   Ben Yedder ", player__height: "170 cm", player__weight: "68 kg", statistics__games__rating: "7.128125", player__birth__date: "1990-08-12", _fichier_source: "depot_1.parquet", dbt_valid_from: "2026-11-13 14:00:00", dbt_valid_to: "2026-11-20 14:00:00"}
          # Joueur 1, version EN COURS : espaces parasites, "cm" et "kg"
          - {player__id: 1, statistics__team__id: 10, statistics__league__id: 61, statistics__league__season: 2023, player__name: "  W.   Ben Yedder ", player__height: "170 cm", player__weight: "68 kg", statistics__games__rating: "7.2", player__birth__date: "1990-08-12", _fichier_source: "depot_2.parquet", dbt_valid_from: "2026-11-20 14:00:00", dbt_valid_to: null}
          # Joueur 2 : valeurs mal formées -> NULL au lieu de faire planter le modèle
          - {player__id: 2, statistics__team__id: 20, statistics__league__id: 61, statistics__league__season: 2023, player__name: "J. David", player__height: " 181 cm ", player__weight: "", statistics__games__rating: "N/A", player__birth__date: "12/08/1990", _fichier_source: "depot_1.parquet", dbt_valid_from: "2026-11-13 14:00:00", dbt_valid_to: null}
          # Joueur 8 : 2 équipes = 2 clés différentes, toutes les deux en cours
          - {player__id: 8, statistics__team__id: 165, statistics__league__id: 78, statistics__league__season: 2022, player__name: "Raphaël Guerreiro", player__height: "170", player__weight: "67", statistics__games__rating: "7", player__birth__date: "1993-12-22", _fichier_source: "depot_1.parquet", dbt_valid_from: "2026-11-13 14:00:00", dbt_valid_to: null}
          - {player__id: 8, statistics__team__id: 157, statistics__league__id: 78, statistics__league__season: 2022, player__name: "Raphaël Guerreiro", player__height: "170", player__weight: "67", statistics__games__rating: "7", player__birth__date: "1993-12-22", _fichier_source: "depot_1.parquet", dbt_valid_from: "2026-11-13 14:00:00", dbt_valid_to: null}

    # ---------------- SORTIE ATTENDUE : 4 lignes (la version fermée a disparu) ----------------
    # note_moyenne entre guillemets avec 6 décimales : la colonne est DECIMAL(10,6)
    # (Postgres compare "7.200000" et non "7.2")
    expect:
      rows:
          - {id_joueur: 1, id_equipe: 10,  _fichier_source: "depot_2.parquet", nom_joueur: "W. Ben Yedder",     taille_cm: 170, poids_kg: 68,   note_moyenne: "7.200000", date_naissance: "1990-08-12"}
          - {id_joueur: 2, id_equipe: 20,  _fichier_source: "depot_1.parquet", nom_joueur: "J. David",          taille_cm: 181, poids_kg: null, note_moyenne: null,       date_naissance: null}
          - {id_joueur: 8, id_equipe: 165, _fichier_source: "depot_1.parquet", nom_joueur: "Raphaël Guerreiro", taille_cm: 170, poids_kg: 67,   note_moyenne: "7.000000", date_naissance: "1993-12-22"}
          - {id_joueur: 8, id_equipe: 157, _fichier_source: "depot_1.parquet", nom_joueur: "Raphaël Guerreiro", taille_cm: 170, poids_kg: 67,   note_moyenne: "7.000000", date_naissance: "1993-12-22"}

  # =================================================================
  # MÉTÉO : time texte -> date, CASE du code météo, flag de version
  # =================================================================
   # =================================================================
  # MÉTÉO : version en cours du snapshot, time texte -> date, CASE du code météo
  # =================================================================
  - name: meteo_date_libelle_version
    description: "Version en cours du snapshot uniquement ; time texte -> date (NULL si mal formé) ; code météo décodé (Inconnu si code imprévu)."
    model: open_meteo_meteo_journaliere

    # ---------------- ENTRÉE : 3 lignes du SNAPSHOT (plus le bronze) ----------------
    given:
      - input: ref('open_meteo_meteo_journaliere_snapshot')
        rows:
          # Brest, 12/08/2023 : ancienne version FERMÉE par le snapshot -> doit disparaître
          - {_param_latitude: 48.39, _param_longitude: -4.49, time: "2023-08-12", weather_code: 3,  _fichier_source: "depot_1.parquet", dbt_valid_from: "2026-11-13 14:00:00", dbt_valid_to: "2026-11-20 14:00:00"}
          # Même lieu, même jour : version EN COURS
          - {_param_latitude: 48.39, _param_longitude: -4.49, time: "2023-08-12", weather_code: 61, _fichier_source: "depot_2.parquet", dbt_valid_from: "2026-11-20 14:00:00", dbt_valid_to: null}
          # Date au mauvais format + code 42 qui n'existe pas dans le CASE (version en cours)
          - {_param_latitude: 45.46, _param_longitude: 9.19,  time: "12/08/2023", weather_code: 42, _fichier_source: "depot_1.parquet", dbt_valid_from: "2026-11-13 14:00:00", dbt_valid_to: null}

    # ---------------- SORTIE ATTENDUE : 2 lignes (la version fermée a disparu) ----------------
    expect:
      rows:
          - {latitude_demandee: 48.39, _fichier_source: "depot_2.parquet", date_meteo: "2023-08-12", code_meteo: 61, libelle_meteo: "Pluie faible"}
          - {latitude_demandee: 45.46, _fichier_source: "depot_1.parquet", date_meteo: null,         code_meteo: 42, libelle_meteo: "Inconnu (42)"}

  # =================================================================
  # GÉOCODAGE : seule la version EN COURS du snapshot passe + espaces nettoyés
  # =================================================================
  - name: geocodage_version_en_cours
    description: "Le modèle ne garde que la version en cours du snapshot (dbt_valid_to vide) et nettoie la ville."
    model: open_meteo_geocodage

    # ---------------- ENTRÉE : 3 lignes du SNAPSHOT (plus le bronze) ----------------
    given:
      - input: ref('open_meteo_geocodage_snapshot')
        rows:
          # Brest BY : ancienne version, FERMÉE par le snapshot (dbt_valid_to rempli)
          - {_ville_fixture: "Brest", name: "Brest", country_code: "BY", _date_depot: "2026-11-13 14:00:00+00", dbt_valid_from: "2026-11-13 14:00:00", dbt_valid_to: "2026-11-13 16:00:00"}
          # Brest FR : version en cours (dbt_valid_to vide)
          - {_ville_fixture: "Brest", name: "Brest", country_code: "FR", _date_depot: "2026-11-13 16:00:00+00", dbt_valid_from: "2026-11-13 16:00:00", dbt_valid_to: null}
          # Ville avec espaces parasites, version en cours
          - {_ville_fixture: "  Leeds,   West Yorkshire ", name: "Leeds", country_code: "GB", _date_depot: "2026-11-13 14:00:00+00", dbt_valid_from: "2026-11-13 14:00:00", dbt_valid_to: null}

    # ---------------- SORTIE ATTENDUE : Brest BY a disparu ----------------
    expect:
      rows:
          - {ville_stade_complete: "Brest",                 code_pays: "FR"}
          - {ville_stade_complete: "Leeds, West Yorkshire", code_pays: "GB"}